apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kubetree
spec:
  version: v0.1.5
  homepage: https://github.com/kubetre/kubetree
  shortDescription: Visualize Kubernetes resources and dependencies
  description: |
    KubeTree is a local-first, read-only Kubernetes
    visualization and troubleshooting tool.

    Explore resource hierarchies, dependencies, logs,
    configurations and certificates through a browser-based
    interface using your existing Kubernetes configuration.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/kubetre/kubetree/releases/download/v0.1.5/kubetree-linux-amd64.tar.gz
    sha256: 58a0a7ed576d3166bf3b7381ae711a2aa4850234c12aff4bb67f6cd03f351a94
    bin: kubetree-linux-amd64
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/kubetre/kubetree/releases/download/v0.1.5/kubetree-linux-arm64.tar.gz
    sha256: 99b02a47e2d01c17aec914563cb3527d3383f1fe8293fba309331f3481756a3b
    bin: kubetree-linux-arm64
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/kubetre/kubetree/releases/download/v0.1.5/kubetree-darwin-amd64.tar.gz
    sha256: 5749c7229677d143745f27a06afb8640ffcb5228eab12f8f344a4212c5c6f51b
    bin: kubetree-darwin-amd64
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/kubetre/kubetree/releases/download/v0.1.5/kubetree-darwin-arm64.tar.gz
    sha256: c4b993fa25686d173ff461cf69371f25719eadb03712097453e5b6f63f02cb8e
    bin: kubetree-darwin-arm64
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/kubetre/kubetree/releases/download/v0.1.5/kubetree-windows-amd64.zip
    sha256: 36a60921cf72a6463ac4b308d55abe3477edc0365cc0ed2f89c400f5bdea5845
    bin: kubetree-windows-amd64.exe
