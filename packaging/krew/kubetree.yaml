apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kubetree
spec:
  version: v0.1.6
  homepage: https://github.com/kubetre/kubetree
  shortDescription: Visualize Kubernetes resources and dependencies
  description: |
    KubeTree is a local-first, read-only Kubernetes
    visualization and troubleshooting tool.

    Explore resource hierarchies, dependencies, logs,
    configurations and certificates through a browser-based
    interface using your existing Kubernetes configuration.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/kubetre/kubetree/releases/download/v0.1.6/kubetree-linux-amd64.tar.gz
    sha256: d9f07475caf06789193aa1fec6b0bf196df421143264e50ddade9d0cc926f3dc
    bin: kubetree-linux-amd64
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/kubetre/kubetree/releases/download/v0.1.6/kubetree-linux-arm64.tar.gz
    sha256: 4ddcef28e45bbe760312bda9b5e66a7040b6284be997dcc85a725c6e11e91cbd
    bin: kubetree-linux-arm64
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/kubetre/kubetree/releases/download/v0.1.6/kubetree-darwin-amd64.tar.gz
    sha256: c280e54f3c5f88e229d31e0406cbe6d04080298509f9c9556624e5d06fa353e9
    bin: kubetree-darwin-amd64
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/kubetre/kubetree/releases/download/v0.1.6/kubetree-darwin-arm64.tar.gz
    sha256: db578f18e18e875c324ea4fafc24854482260a88e7596838990391028616e4ec
    bin: kubetree-darwin-arm64
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/kubetre/kubetree/releases/download/v0.1.6/kubetree-windows-amd64.zip
    sha256: 4d111dcc4f335543b708c4b162d1f0dc80e2a8f9ad2de016d7f20f25b600ec28
    bin: kubetree-windows-amd64.exe
